name: Dual approval merge gate

on:
  pull_request_target:
    # Retargeting away from main must clear that PR from shared-SHA evaluations.
    types: [opened, reopened, synchronize, edited, ready_for_review, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Merge gate tests and review signal]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# Serialize writes: an older evaluation must not overwrite a newer decision.
concurrency:
  group: dual-approval-merge-gate
  cancel-in-progress: false

jobs:
  evaluate:
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'pull_request_target' || github.event.pull_request.base.ref == 'main' || github.event.action == 'edited')
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { runGate } = require('./.github/scripts/merge-gate.cjs');
            await runGate({ github, context, core });
